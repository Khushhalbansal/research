        config: configs/ablation/no_l_out.yaml
        estimated_gpu_minutes: 120
      - name: ablation_no_l_rad
        type: train_lrmc
        config: configs/ablation/no_l_rad.yaml
        estimated_gpu_minutes: 120
      - name: ablation_gamma_0.05
        type: train_lrmc
        config: configs/ablation/gamma_0.05.yaml
        estimated_gpu_minutes: 120
      - name: ablation_gamma_0.2
        type: train_lrmc
        config: configs/ablation/gamma_0.2.yaml
        estimated_gpu_minutes: 120
      - name: ablation_gamma_0.3
        type: train_lrmc
        config: configs/ablation/gamma_0.3.yaml
        estimated_gpu_minutes: 120
      - name: ablation_gamma_0.5
        type: train_lrmc
        config: configs/ablation/gamma_0.5.yaml
        estimated_gpu_minutes: 120
      - name: ablation_split_naive_holdout
        type: train_lrmc
        config: configs/ablation/split_naive_holdout.yaml
        estimated_gpu_minutes: 120
      - name: ablation_prototypes_batch_mean
        type: train_lrmc
        config: configs/ablation/prototypes_batch_mean.yaml
        estimated_gpu_minutes: 120
      - name: ablation_distance_euclidean
        type: train_lrmc
        config: configs/ablation/distance_euclidean.yaml
        estimated_gpu_minutes: 120
      - name: ablation_temperature_0.05
        type: train_lrmc
        config: configs/ablation/temperature_0.05.yaml
        estimated_gpu_minutes: 120
      - name: ablation_temperature_0.2
        type: train_lrmc
        config: configs/ablation/temperature_0.2.yaml
        estimated_gpu_minutes: 120
      - name: ablation_temperature_0.5
        type: train_lrmc
        config: configs/ablation/temperature_0.5.yaml
        estimated_gpu_minutes: 120
      - name: ablation_margin_0.05
        type: train_lrmc
        config: configs/ablation/margin_0.05.yaml
        estimated_gpu_minutes: 120
      - name: ablation_margin_0.2
        type: train_lrmc
        config: configs/ablation/margin_0.2.yaml
        estimated_gpu_minutes: 120
      - name: ablation_margin_0.3
        type: train_lrmc
        config: configs/ablation/margin_0.3.yaml
        estimated_gpu_minutes: 120
      - name: ablation_embed_dim_64
        type: train_lrmc
        config: configs/ablation/embed_dim_64.yaml
        estimated_gpu_minutes: 120
      - name: ablation_embed_dim_256
        type: train_lrmc
        config: configs/ablation/embed_dim_256.yaml
        estimated_gpu_minutes: 120
      - name: ablation_backbone_scratch
        type: train_lrmc
        config: configs/ablation/backbone_scratch.yaml
        estimated_gpu_minutes: 120
      - name: ablation_n_unknown_1
        type: train_lrmc
        config: configs/ablation/n_unknown_1.yaml
        estimated_gpu_minutes: 120
      - name: ablation_n_unknown_5
        type: train_lrmc
        config: configs/ablation/n_unknown_5.yaml
        estimated_gpu_minutes: 120
      - name: ablation_n_unknown_8
        type: train_lrmc
        config: configs/ablation/n_unknown_8.yaml
        estimated_gpu_minutes: 120
      - name: ablation_backbone_resnet18
        type: train_lrmc
        config: configs/ablation/backbone_resnet18.yaml
        estimated_gpu_minutes: 203

  C:
    description: "BIG 2015 + extras."
    jobs:
      - name: big2015_main_lrmc
        type: train_lrmc
        config: configs/base_big2015.yaml
        estimated_gpu_minutes: 140
      - name: big2015_baseline_softmax_msp
        type: baseline_network
        config: configs/base_big2015.yaml
        baseline: softmax_msp
        params: { epochs: 15 }
        estimated_gpu_minutes: 105
      - name: big2015_baseline_fixed_radius_prototype
        type: baseline_embedding
        config: configs/base_big2015.yaml
        baseline: fixed_radius_prototype
        depends_on: big2015_main_lrmc
        params: { quantile: 0.9 }
        estimated_gpu_minutes: 3
