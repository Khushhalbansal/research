# Tier-C config: BIG 2015, real ViT backbone. data.root/cache_dir MUST be
# overridden to the actual Kaggle input/working paths -- see HANDOFF.md.
run_name: lrmc_big2015_main
seed: 0
device: cuda
is_synthetic: false

backbone:
  name: vit_tiny_patch16_224
  img_size: 224
  pretrained: true
  local_weights_path: null
  in_chans_mode: replicate

projection_head:
  hidden_dim: 512
  out_dim: 128

prototypes:
  mode: ema
  momentum: 0.9

radius:
  r_init: 0.5
  lr_multiplier: 10.0

loss:
  temperature: 0.1
  alpha: 1.0
  beta: 1.0
  gamma: 0.1
  margin: 0.1
  distance_metric: cosine

data:
  dataset: big2015
  root: /kaggle/input/microsoft-malware-classification-challenge
  cache_dir: /kaggle/working/cache
  image_size: 224
  intermediate_size: 256
  batch_size: 64
  num_workers: 2
  class_balanced_sampling: true

split:
  protocol: random_k_unknown
  n_unknown: 2
  seed: 0
  val_frac: 0.15
  test_frac: 0.2
  pseudo_unknown: true
  group_aware: false

optim:
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 20
  warmup_epochs: 2
  grad_accumulation_steps: 1
  checkpoint_every_n_epochs: 5

inference:
  kappa: 1.0
  score: ratio

output_dir: runs/lrmc_big2015_main
